name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A1BABB: ${{ secrets.A1BABB }}
          BA8184: ${{ secrets.BA8184 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A1BABB', ''), os.environ.get('BA8184', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 5f6f2700d099d8d25a3dfa8de70b06 -->', a)
          if b:
              patched = patched.replace('<!-- ca70ac8f1a27e4000f13b7ae81173570775e0ea028f39dcc -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
